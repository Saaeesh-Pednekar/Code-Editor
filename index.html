<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main terminal window shell -->
    <div class="terminal-container" onclick="focusInput()">
        <div class="terminal-history" id="history">
            <div>Welcome to WebTerminal v1.0. Type 'help' or valid JS code.</div>
        </div>
        <div class="input-line">
            <span class="prompt">js-user:$</span>
            <input type="text" id="terminal-input" autofocus autocomplete="off" stroke="none">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
